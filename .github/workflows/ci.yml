name: CI

# Platform checks on every push and pull request. No AWS credentials are used or needed:
# the suite runs against in-memory fakes, and the template is only linted, never deployed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 cfn-lint
      - name: Template lint (W1030: the CertificateArn parameter is a plain string on purpose)
        run: cfn-lint -i W1030 -t template.yaml
      - name: Local test suite
        run: node tests/run.mjs
